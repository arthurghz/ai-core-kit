name: Publish to npm

# Publishes @arthurghz/create-ack to the official npm registry when you push a
# version tag, e.g.  git tag v0.1.0 && git push origin v0.1.0
# One-time setup: create an npm "Automation" access token (npmjs.com ->
# Access Tokens) and add it to this repo as the secret NPM_TOKEN
# (Settings -> Secrets and variables -> Actions). The @arthurghz scope must
# belong to your npm account/org. Provenance is attested via OIDC (public repo).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack + validate only (no publish)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Guard — tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG  package.json=$PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION. Bump version + retag."
            exit 1
          fi

      - name: Pack (inspect tarball contents)
        run: npm pack --dry-run

      - name: Publish to npm (provenance, public scope)
        if: ${{ !inputs.dry_run }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
