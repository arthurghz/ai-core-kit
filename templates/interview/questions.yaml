# =============================================================================
# templates/interview/questions.yaml
# -----------------------------------------------------------------------------
# The DETERMINISTIC question bank that the `/ack-init` interview drives.
#
# This file is the SOLE source of interview questions. /ack-init walks `questions`
# IN ORDER, skipping any question whose `applies_to` excludes the chosen archetype
# or whose `skip_if`/`ask_if` evaluates against EARLIER answers. The collected
# answers are written wholesale into the manifest's `managed:` subtree at each
# question's `writes_to` path. There is no LLM in the loop: same answers in =>
# byte-identical manifest out (manifest idempotency, schema I2).
#
# CONTRACT WITH THE FROZEN SCHEMA (project.manifest.schema.yaml, schema_version 3)
#   * Every `writes_to` below is a dotted path UNDER `managed:` and MUST resolve to
#     a property declared in the frozen schema (global invariant I1). /ack-init
#     cross-checks this at startup and HARD-REFUSES on any orphan key. The paths
#     here were enumerated directly from the schema; nothing else is writable by
#     the interview. (manifest_hash and rendered_files are written by ack/P4, NOT
#     by the interview, so they are deliberately absent.)
#   * `archetype` is the FIRST, mandatory question and the BRANCH AXIS (I3). Its
#     answer narrows every subsequent question via `applies_to`.
#
# FIELD REFERENCE (per question)
#   id          unique, stable, kebab-case. Referenced by ask_if/skip_if.
#   prompt      human-facing question text.
#   type        select | multiselect | text | bool
#   options     for select/multiselect: list of {value, label?}. Each entry's
#               value is what is written. For type:select the chosen value is
#               written scalar; for multiselect a list is written.
#   default     value pre-filled / used on non-interactive runs. For select it
#               MUST be one of options.value; for multiselect a subset; for bool
#               true|false; for text a string (or "" / omitted).
#   applies_to  list of archetypes this question is asked for, or the literal
#               "all". Archetype gating is evaluated BEFORE ask_if/skip_if.
#   ask_if      OPTIONAL. Question is asked ONLY when the expression is true.
#   skip_if     OPTIONAL. Question is SKIPPED when the expression is true.
#               (ask_if and skip_if are mutually exclusive on a single question.)
#   writes_to   dotted manifest path under managed: (the value's destination).
#
# EXPRESSION GRAMMAR (ask_if / skip_if) -- intentionally tiny + deterministic
#   Operands : a prior question's id (its written value) OR a literal
#              (bareword | 'single-quoted string' | true | false | number).
#   Operators: ==  !=  in  not_in   (no parentheses, no boolean and/or chains)
#   Forms    : "<id> == <literal>"
#              "<id> != <literal>"
#              "<id> in [a, b, c]"
#              "<id> not_in [a, b, c]"
#   Only EARLIER questions (by document order, after gating) may be referenced.
#   A referenced id that was itself skipped evaluates to the unknown sentinel and
#   makes `== / in` false and `!= / not_in` true (fail-safe: skip rather than ask).
#
# ARCHETYPE COVERAGE
#   backend-api  : covered DEEPLY (persistence, api spec, contract gate, telemetry)
#   fullstack    : covered DEEPLY (adds design_system; persistence; dual app/api gate)
#   saas         : covered DEEPLY (the OPINIONATED stack: Vercel + Next.js App Router +
#     React + shadcn/ui + Supabase Postgres + Clerk auth + Drizzle ORM + Stripe billing).
#     Reuses the fullstack design_system + persistence + app/lib gate questions
#     (applies_to widened to include saas) and adds three stack selects:
#     auth.provider (default clerk), hosting.target (default vercel),
#     billing.provider (default stripe). auth=clerk and orm=drizzle are the
#     defaults; alternatives live in the enums.
#   monorepo | library-sdk | infra-iac : schema-known, minimal-core. They answer
#     only the universal core questions (archetype, project identity, features,
#     contract_gate.mode + protected_paths, telemetry.enabled, ci_cd). DB/design
#     questions never fire for them (deterministic, not an LLM hope -- schema I4).
# =============================================================================

schema_target: 3   # the manifest schema_version this bank is authored against.

questions:

  # ===========================================================================
  # 0. ARCHETYPE  -- FIRST + MANDATORY. The branch axis (schema I3).
  # ===========================================================================
  - id: archetype
    prompt: "What kind of project is this? (selects the question set + template set)"
    type: select
    options:
      - { value: backend-api,  label: "Backend API service (deep)" }
      - { value: fullstack,    label: "Fullstack web app + API (deep)" }
      - { value: saas,         label: "SaaS web app (Vercel+Next+shadcn+Supabase) (deep)" }
      - { value: monorepo,     label: "Monorepo workspace (minimal core)" }
      - { value: library-sdk,  label: "Library / SDK package (minimal core)" }
      - { value: infra-iac,    label: "Infrastructure / IaC (minimal core)" }
    default: backend-api
    applies_to: all
    writes_to: archetype

  # ===========================================================================
  # 1. PROJECT IDENTITY + STACK  -- universal, asked for every archetype.
  #    framework + architecture are archetype-scoped (deep archetypes only).
  # ===========================================================================
  - id: project_name
    prompt: "Project name (lowercase, kebab-case; used as ${PROJECT_NAME})"
    type: text
    default: ""
    applies_to: all
    writes_to: project.name

  - id: project_description
    prompt: "One-line project description"
    type: text
    default: ""
    applies_to: all
    writes_to: project.description

  - id: language
    prompt: "Primary implementation language"
    type: select
    options:
      - { value: python,     label: "Python" }
      - { value: typescript, label: "TypeScript" }
      - { value: go,         label: "Go" }
      - { value: rust,       label: "Rust" }
      - { value: java,       label: "Java" }
    default: python
    applies_to: all
    writes_to: project.language

  - id: runtime
    prompt: "Exact runtime / version pin (e.g. python3.12, node20). Blank to skip."
    type: text
    default: ""
    applies_to: all
    writes_to: project.runtime

  # Package manager options are language-dependent; the full union is offered and
  # the consumer simply records the chosen value (schema accepts a free string).
  - id: package_manager
    prompt: "Package manager"
    type: select
    options:
      - { value: uv,    label: "uv (Python)" }
      - { value: pip,   label: "pip (Python)" }
      - { value: pnpm,  label: "pnpm (Node)" }
      - { value: npm,   label: "npm (Node)" }
      - { value: cargo, label: "cargo (Rust)" }
      - { value: go,    label: "go modules (Go)" }
    default: uv
    applies_to: all
    writes_to: project.package_manager

  # --- framework: ENUM IS ARCHETYPE-SCOPED. Two mutually-exclusive questions, one
  #     per deep archetype, gated by applies_to. Never asked for minimal-core. ---
  - id: framework_backend
    prompt: "Backend framework"
    type: select
    options:
      - { value: fastapi, label: "FastAPI (Python)" }
      - { value: express, label: "Express (Node)" }
      - { value: nestjs,  label: "NestJS (Node)" }
      - { value: gin,     label: "Gin (Go)" }
      - { value: axum,    label: "Axum (Rust)" }
    default: fastapi
    applies_to: [backend-api]
    writes_to: project.framework

  # framework: ONE question covers fullstack AND saas (both write project.framework;
  # the assembler reads framework_fullstack for either). For saas the stack is
  # OPINIONATED on Next.js (React, App Router) — `next` is the pinned default and the
  # only stack the saas archetype tree renders against; the other options exist for a
  # generic fullstack fork. SaaS forks accept the default.
  - id: framework_fullstack
    prompt: "Fullstack framework (saas pins Next.js / React App Router)"
    type: select
    options:
      - { value: next,      label: "Next.js (React App Router — saas default)" }
      - { value: remix,     label: "Remix" }
      - { value: sveltekit, label: "SvelteKit" }
      - { value: nuxt,      label: "Nuxt" }
    default: next
    applies_to: [fullstack, saas]
    writes_to: project.framework

  - id: architecture
    prompt: "Architecture / folder topology (drives the P4 scaffold)"
    type: select
    options:
      - { value: layered,            label: "Layered" }
      - { value: hexagonal,          label: "Hexagonal / ports-and-adapters" }
      - { value: modular-monolith,   label: "Modular monolith" }
      - { value: clean,              label: "Clean architecture" }
      - { value: mvc,                label: "MVC" }
    default: layered
    applies_to: [backend-api, fullstack, saas]
    writes_to: project.architecture

  # ===========================================================================
  # 2. FEATURES  -- stage-B opt-in toggles. Universal (every archetype answers).
  #    sdd_gate is the master switch for the contract gate; gate questions below
  #    are skipped when sdd_gate is false.
  # ===========================================================================
  - id: feat_hooks
    prompt: "Install opt-in PreToolUse/PostToolUse hooks?"
    type: bool
    default: true
    applies_to: all
    writes_to: features.hooks

  - id: feat_mcp
    prompt: "Wire a project .mcp.json (MCP servers)?"
    type: bool
    default: false
    applies_to: all
    writes_to: features.mcp

  - id: feat_agent_teams
    prompt: "Enable experimental agent teams (CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1)?"
    type: bool
    default: false
    applies_to: all
    writes_to: features.agent_teams

  - id: feat_sdd_gate
    prompt: "Enable the spec-driven contract gate? (master switch)"
    type: bool
    default: true
    applies_to: all
    writes_to: features.sdd_gate

  # ===========================================================================
  # 3. API-FIRST  -- backend-api defaults true; fullstack ties to whether a
  #    separate api/ tier exists. Not asked for minimal-core archetypes.
  # ===========================================================================
  - id: api_first
    prompt: "API-first? (scaffold an API spec stub and contract-gate the API surface)"
    type: bool
    default: true
    applies_to: [backend-api, fullstack]
    writes_to: api_first

  # ===========================================================================
  # 4. PERSISTENCE  -- backend-api + fullstack + saas. Minimal-core archetypes
  #    NEVER see a DB question. Inner DB/ORM/migration questions are skipped when
  #    persistence is not enabled (cascade gating).
  #
  #    SaaS NOTE: the OPINIONATED saas stack is Supabase (managed Postgres) +
  #    Drizzle. `supabase` and `drizzle` are first-class OPTIONS here and the saas
  #    archetype reuses these same questions (applies_to includes saas). The shared
  #    scalar `default` stays postgres/sqlalchemy so the backend-api/fullstack
  #    contracts are byte-stable; a saas fork SELECTS supabase + drizzle (the
  #    recommended stack, surfaced first in the option lists). Per-archetype default
  #    pinning would require the assembler to read a saas-specific question id (the
  #    framework_backend/framework_fullstack multi-id pattern); see followups.
  # ===========================================================================
  - id: persistence_enabled
    prompt: "Does this project own a database / persistence layer?"
    type: bool
    default: true
    applies_to: [backend-api, fullstack, saas]
    writes_to: persistence.enabled

  - id: persistence_db
    prompt: "Database engine (saas: Supabase = managed Postgres)"
    type: select
    options:
      - { value: supabase, label: "Supabase (managed PostgreSQL — saas default)" }
      - { value: postgres, label: "PostgreSQL" }
      - { value: mysql,    label: "MySQL" }
      - { value: sqlite,   label: "SQLite" }
      - { value: mongodb,  label: "MongoDB" }
      - { value: none,     label: "None" }
    default: postgres
    applies_to: [backend-api, fullstack, saas]
    ask_if: "persistence_enabled == true"
    writes_to: persistence.db

  - id: persistence_orm
    prompt: "ORM / data-access layer (saas: Drizzle)"
    type: select
    options:
      - { value: drizzle,    label: "Drizzle (Node — saas default)" }
      - { value: sqlalchemy, label: "SQLAlchemy (Python)" }
      - { value: prisma,     label: "Prisma (Node)" }
      - { value: gorm,       label: "GORM (Go)" }
      - { value: none,       label: "None / raw" }
    default: sqlalchemy
    applies_to: [backend-api, fullstack, saas]
    ask_if: "persistence_enabled == true"
    writes_to: persistence.orm

  - id: migrations_enabled
    prompt: "Manage schema migrations?"
    type: bool
    default: true
    applies_to: [backend-api, fullstack, saas]
    ask_if: "persistence_enabled == true"
    writes_to: persistence.migrations.enabled

  - id: migrations_tool
    prompt: "Migration tool"
    type: select
    options:
      - { value: alembic,        label: "Alembic (SQLAlchemy)" }
      - { value: prisma-migrate, label: "Prisma Migrate" }
      - { value: flyway,         label: "Flyway" }
      - { value: goose,          label: "goose (Go)" }
      - { value: none,           label: "None / Drizzle-Kit (saas)" }
    default: alembic
    applies_to: [backend-api, fullstack, saas]
    ask_if: "migrations_enabled == true"
    writes_to: persistence.migrations.tool

  - id: migrations_dir
    prompt: "Migrations directory (relative path; rendered into the scaffold)"
    type: text
    default: "migrations/"
    applies_to: [backend-api, fullstack, saas]
    ask_if: "migrations_enabled == true"
    writes_to: persistence.migrations.dir

  # ===========================================================================
  # 4b. SaaS STACK  -- SaaS ONLY. The OPINIONATED default is Clerk (auth) + Vercel
  #     (hosting) + Stripe (billing); these are ALWAYS-PRESENT in the saas tree
  #     (the schema REQUIRES auth/hosting/billing only via the saas interview, and
  #     the assembler emits them for archetype==saas defaulting clerk/vercel/stripe).
  #     Alternatives live in the enums for forks that swap at the edges. Each
  #     writes_to is a v3 schema property (auth.provider | hosting.target |
  #     billing.provider); none of these fire for any non-saas archetype.
  # ===========================================================================
  - id: auth_provider
    prompt: "Authentication provider (saas default: Clerk)"
    type: select
    options:
      - { value: clerk,         label: "Clerk (saas default)" }
      - { value: supabase-auth, label: "Supabase Auth" }
      - { value: nextauth,      label: "NextAuth / Auth.js" }
      - { value: none,          label: "None / custom" }
    default: clerk
    applies_to: [saas]
    writes_to: auth.provider

  - id: hosting_target
    prompt: "Hosting target (saas default: Vercel). Distinct from CI/CD target."
    type: select
    options:
      - { value: vercel,  label: "Vercel (saas default)" }
      - { value: netlify, label: "Netlify" }
      - { value: fly,     label: "Fly.io" }
      - { value: aws,     label: "AWS" }
      - { value: gcp,     label: "GCP" }
      - { value: none,    label: "None / self-host" }
    default: vercel
    applies_to: [saas]
    writes_to: hosting.target

  - id: billing_provider
    prompt: "Billing / payments provider (saas default: Stripe)"
    type: select
    options:
      - { value: stripe,      label: "Stripe (saas default)" }
      - { value: lemonsqueezy, label: "Lemon Squeezy" }
      - { value: none,        label: "None (no billing)" }
    default: stripe
    applies_to: [saas]
    writes_to: billing.provider

  # ===========================================================================
  # 4c. INFRASTRUCTURE-AS-CODE  -- ORTHOGONAL feature toggle (NOT an archetype).
  #     feat_iac is asked for EVERY deep/minimal archetype (incl. backend-api);
  #     when true it requires the managed iac block (schema allOf) and the
  #     provider+tool selects fire (ask_if). The assembler DERIVES iac.is_aws /
  #     iac.is_gcp from iac.provider so the boolean-only path-segment guards
  #     (_when.iac.is_aws/) pick the per-provider subtree WITHOUT an equality
  #     operator in the render engine.
  #
  #     Phase E byte-stability invariant: the assembler emits managed.features.iac
  #     ONLY when it carries real signal — the resolved value is TRUE, or the human
  #     EXPLICITLY supplied feat_iac (an explicit `false` is meaningful). A merely-
  #     fired default:false question writes NOTHING. That is what lets backend-api
  #     rejoin applies_to here while the frozen Phase C test (a default backend-api
  #     manifest carries NO features.iac key) stays green — and it keeps fullstack /
  #     saas / monorepo / infra-iac default manifests byte-stable too.
  # ===========================================================================
  - id: feat_iac
    prompt: "Provision infrastructure-as-code (Terraform/Pulumi/...) in this repo?"
    type: bool
    default: false
    applies_to: [backend-api, fullstack, saas, monorepo, infra-iac]
    writes_to: features.iac

  - id: iac_provider
    prompt: "Cloud provider for the IaC stack"
    type: select
    options:
      - { value: aws, label: "AWS" }
      - { value: gcp, label: "GCP" }
    default: aws
    applies_to: [backend-api, fullstack, saas, monorepo, infra-iac]
    ask_if: "feat_iac == true"
    writes_to: iac.provider

  - id: iac_tool
    prompt: "IaC tool"
    type: select
    options:
      - { value: terraform,      label: "Terraform (default)" }
      - { value: pulumi,         label: "Pulumi" }
      - { value: cloudformation, label: "CloudFormation (AWS)" }
      - { value: cdk,            label: "AWS CDK" }
    default: terraform
    applies_to: [backend-api, fullstack, saas, monorepo, infra-iac]
    ask_if: "feat_iac == true"
    writes_to: iac.tool

  # ===========================================================================
  # 5. CONTRACT GATE  -- universal mode + protected_paths (gate is NEVER vacuous,
  #    schema I4: protected_paths minItems 1). All gate questions are skipped when
  #    the master switch feat_sdd_gate is false. scope/exempt are deep-archetype
  #    only (minimal-core ships mode + protected_paths and nothing finer).
  # ===========================================================================
  - id: gate_mode
    prompt: "Contract gate mode (block = deny unapproved edits, warn = allow+warn, off)"
    type: select
    options:
      - { value: block, label: "block (exit 2 + deny)" }
      - { value: warn,  label: "warn (allow with stderr warning)" }
      - { value: off,   label: "off (no enforcement)" }
    default: block
    applies_to: all
    skip_if: "feat_sdd_gate == false"
    writes_to: contract_gate.mode

  # glob_dialect is a documented const in the schema ("fnmatch"); the interview
  # still records it explicitly so the manifest is fully self-describing and the
  # python3-pinned hook reads it rather than a hardcoded default.
  - id: gate_glob_dialect
    prompt: "Glob dialect for gate path matching (fixed: fnmatch with **)"
    type: select
    options:
      - { value: fnmatch, label: "fnmatch (** supported)" }
    default: fnmatch
    applies_to: all
    skip_if: "feat_sdd_gate == false"
    writes_to: contract_gate.glob_dialect

  # protected_paths: REQUIRED non-empty. Defaults differ per archetype, so each
  # archetype gets a tailored default set (deterministic per-archetype, schema I4).
  - id: gate_protected_paths_backend
    prompt: "Protected paths for the gate (edits here need an approved contract)"
    type: multiselect
    options:
      - { value: "src/**" }
      - { value: "migrations/**" }
      - { value: "openapi/**" }
      - { value: "pkg/**" }
      - { value: "internal/**" }
    default: ["src/**", "migrations/**", "openapi/**"]
    applies_to: [backend-api]
    skip_if: "feat_sdd_gate == false"
    writes_to: contract_gate.protected_paths

  # Shared by fullstack AND saas (the assembler reads gate_protected_paths_fullstack
  # for both). The default stays fullstack-safe (byte-stable); the saas-relevant
  # globs (app/**, lib/**, db/**) are first-class OPTIONS a saas fork selects —
  # app/** + src/** in the default already cover the saas App Router surface.
  - id: gate_protected_paths_fullstack
    prompt: "Protected paths for the gate (edits here need an approved contract)"
    type: multiselect
    options:
      - { value: "app/**" }
      - { value: "api/**" }
      - { value: "src/**" }
      - { value: "lib/**" }
      - { value: "db/**" }
      - { value: "prisma/schema.prisma" }
      - { value: "openapi/**" }
    default: ["app/**", "api/**", "src/**", "prisma/schema.prisma"]
    applies_to: [fullstack, saas]
    skip_if: "feat_sdd_gate == false"
    writes_to: contract_gate.protected_paths

  - id: gate_protected_paths_core
    prompt: "Protected paths for the gate (edits here need an approved contract)"
    type: multiselect
    options:
      - { value: "src/**" }
      - { value: "packages/**" }
      - { value: "modules/**" }
      - { value: "lib/**" }
      - { value: "deploy/**" }
      - { value: "infra/**" }
      - { value: "terraform/**" }
    default: ["src/**"]
    applies_to: [monorepo, library-sdk, infra-iac]
    skip_if: "feat_sdd_gate == false"
    writes_to: contract_gate.protected_paths

  # scope: contract-bearing subset (deep archetypes only). Defaults differ by axis.
  - id: gate_scope_backend
    prompt: "Gate scope: which protected paths ALSO require an approved contract"
    type: multiselect
    options:
      - { value: "src/**" }
      - { value: "openapi/**" }
      - { value: "migrations/**" }
    default: ["src/**"]
    applies_to: [backend-api]
    skip_if: "feat_sdd_gate == false"
    writes_to: contract_gate.scope

  - id: gate_scope_fullstack
    prompt: "Gate scope: which protected paths ALSO require an approved contract"
    type: multiselect
    options:
      - { value: "app/**" }
      - { value: "api/**" }
      - { value: "src/**" }
      - { value: "lib/**" }
      - { value: "db/**" }
    default: ["app/**", "api/**"]
    applies_to: [fullstack, saas]
    skip_if: "feat_sdd_gate == false"
    writes_to: contract_gate.scope

  # exempt: WINS over scope/protected_paths. Deep archetypes only; per-axis defaults.
  - id: gate_exempt_backend
    prompt: "Exempt globs (never gated; wins over scope + protected_paths)"
    type: multiselect
    options:
      - { value: "**/*.test.*" }
      - { value: "migrations/**" }
      - { value: "**/__snapshots__/**" }
      - { value: "**/conftest.py" }
    default: ["**/*.test.*", "migrations/**", "**/__snapshots__/**"]
    applies_to: [backend-api]
    skip_if: "feat_sdd_gate == false"
    writes_to: contract_gate.exempt

  - id: gate_exempt_fullstack
    prompt: "Exempt globs (never gated; wins over scope + protected_paths)"
    type: multiselect
    options:
      - { value: "**/*.test.*" }
      - { value: "**/*.stories.tsx" }
      - { value: "prisma/migrations/**" }
      - { value: "supabase/migrations/**" }
      - { value: "**/__snapshots__/**" }
    default: ["**/*.test.*", "**/*.stories.tsx", "prisma/migrations/**", "**/__snapshots__/**"]
    applies_to: [fullstack, saas]
    skip_if: "feat_sdd_gate == false"
    writes_to: contract_gate.exempt

  - id: gate_require_approval_by
    prompt: "Advisory reviewers/roles whose sign-off marks a contract approved (comma-separated identities). Blank = none."
    type: multiselect
    options:
      - { value: "@owners" }
      - { value: "@platform" }
      - { value: "@security" }
    default: []
    applies_to: [backend-api, fullstack, saas]
    skip_if: "feat_sdd_gate == false"
    writes_to: contract_gate.require_approval_by

  # ===========================================================================
  # 6. DESIGN SYSTEM  -- FULLSTACK + SaaS (schema-enforced: REQUIRED for both,
  #    FORBIDDEN for backend-api). applies_to:[fullstack, saas] guarantees these
  #    keys are never written for any other archetype, satisfying the schema's
  #    properties.design_system:false branch for backend-api by construction. saas
  #    reuses the fullstack design-system payload (shadcn/ui + OKLch theme) wholesale.
  # ===========================================================================
  - id: design_system_install
    prompt: "Install the bundled (Apache-2.0) design-system skills?"
    type: bool
    default: true
    applies_to: [fullstack, saas]
    writes_to: design_system.install

  - id: design_system_source
    prompt: "Design-system directory in the child repo"
    # Child-relative location where the design-system subtree lands once
    # rendered (the `_when.design_system.install/` guard is stripped, so the
    # subtree materializes at `design-system/`). This value is echoed verbatim
    # into child docs (CLAUDE.md, design-system/README.md); it MUST NOT be a
    # kit-internal `templates/archetypes/...` path or the render-time path-hygiene
    # assertion (§6, fail-closed) rejects the rendered child file.
    type: text
    default: "design-system"
    applies_to: [fullstack, saas]
    ask_if: "design_system_install == true"
    writes_to: design_system.source

  # ===========================================================================
  # 7. TELEMETRY  -- enabled is universal. Attribution + budgets are asked only
  #    when telemetry is on. Pricing ref recorded for the offline P6 aggregator.
  # ===========================================================================
  - id: telemetry_enabled
    prompt: "Enable offline cost telemetry attribution for this project?"
    type: bool
    default: true
    applies_to: all
    writes_to: telemetry.enabled

  - id: telemetry_attr_mode
    prompt: "Cost attribution mode"
    type: select
    options:
      - { value: branch_prefix, label: "branch_prefix (parse feature from git branch)" }
      - { value: sidecar_map,   label: "sidecar_map (timestamp -> contract_id map)" }
    default: branch_prefix
    applies_to: all
    ask_if: "telemetry_enabled == true"
    writes_to: telemetry.attribution.mode

  - id: telemetry_branch_prefix
    prompt: "Branch prefix for attribution (e.g. feat/ => branch feat/<contract_id>-* buckets to contract_id)"
    type: text
    default: "feat/"
    applies_to: all
    ask_if: "telemetry_attr_mode == branch_prefix"
    writes_to: telemetry.attribution.branch_prefix

  - id: telemetry_default_bucket
    prompt: "Default bucket for spend that matches no rule (explicit, never silently dropped)"
    type: text
    default: "unattributed"
    applies_to: all
    ask_if: "telemetry_enabled == true"
    writes_to: telemetry.attribution.default_bucket

  - id: telemetry_pricing_ref
    prompt: "Path to the versioned model->price map (pricing.json)"
    type: text
    default: "telemetry/pricing.json"
    applies_to: all
    ask_if: "telemetry_enabled == true"
    writes_to: telemetry.pricing_ref

  # ===========================================================================
  # 8. DISCOVERY  -- child opt-in to the propose/dispose loop. Default OFF
  #    (forkability, schema I7: the meta discovery engine is never copied in).
  # ===========================================================================
  - id: discovery_enabled
    prompt: "Opt this child into the discovery propose/dispose loop? (default off)"
    type: bool
    default: false
    applies_to: all
    writes_to: discovery.enabled

  # ===========================================================================
  # 9. CI/CD  -- selects which CI workflow template P4 renders. Universal.
  # ===========================================================================
  - id: ci_cd_target
    prompt: "CI/CD target"
    type: select
    options:
      - { value: github-actions, label: "GitHub Actions" }
      - { value: gitlab-ci,      label: "GitLab CI" }
      - { value: none,           label: "None" }
    default: github-actions
    applies_to: all
    writes_to: ci_cd.target
